# [remnawave-fork] Self-contained image build for the per-user-per-inbound fork.
# Builds the node (remnanode) image and pushes to GHCR using the built-in GITHUB_TOKEN —
# no Docker Hub / Telegram / custom PAT (unlike the inherited build-and-push.yml).
# Pulls the forked xray binary via the Dockerfile ARGs (UPSTREAM_REPO/XRAY_CORE_VERSION):
# cut a matching release on the xray-core fork FIRST. See ../../FORK-RESILIENCE.md.
name: fork-build (node)

on:
  push:
    branches: [per-user-per-inbound-traffic-stats]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/node:perinbound
